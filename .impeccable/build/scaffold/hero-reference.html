<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: approved-desktop-practice.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gluten:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f8f8f8}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1077px">
  <div class="r-nav region chrome" data-region="nav"><!-- Flat black navigation band. --></div>
  <div class="r-brand region text" data-region="brand"><!-- Jazz Ear Lab in white bold humanist sans. --><p style="font-size:var(--r-brand-font);font-family:var(--r-brand-family),sans-serif;font-weight:var(--r-brand-weight);line-height:1.05;margin:0">brand</p></div>
  <div class="r-practice-link region control" data-region="practice-link"><!-- White Practice label with music icon and yellow current-location underline.: rebuild the control's chrome from the crop (comp-spec.mjs --crop practice-link); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-insights-link region control" data-region="insights-link"><!-- White Insights navigation with chart icon.: rebuild the control's chrome from the crop (comp-spec.mjs --crop insights-link); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-legacy-link region control" data-region="legacy-link"><!-- White Legacy navigation with library icon.: rebuild the control's chrome from the crop (comp-spec.mjs --crop legacy-link); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-task-band region chrome" data-region="task-band"><!-- Flat yellow task band. --></div>
  <div class="r-task-title region text" data-region="task-title"><!-- M2 Recognition in bold black humanist sans. --><p style="font-size:var(--r-task-title-font);line-height:1.05;margin:0">task-title</p></div>
  <div class="r-question-count region text" data-region="question-count"><!-- Question 4 / 20 in black. --><p style="font-size:var(--r-question-count-font);line-height:1.05;margin:0">question-count</p></div>
  <div class="r-stop region control" data-region="stop"><!-- Stop action with square icon in session header.: rebuild the control's chrome from the crop (comp-spec.mjs --crop stop); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-known-chord region text" data-region="known-chord"><!-- Known chord label. --><p style="font-size:var(--r-known-chord-font);line-height:1.05;margin:0">known-chord</p></div>
  <div class="r-chord region text" data-region="chord"><!-- C7 dominant black chord anchor. --><p style="line-height:1.05;margin:0">chord</p></div>
  <div class="r-prompt region text" data-region="prompt"><!-- Which chord degree? in bold. --><p style="font-size:var(--r-prompt-font);line-height:1.05;margin:0">prompt</p></div>
  <div class="r-status region text" data-region="status"><!-- Your turn readiness text. --><p style="font-size:var(--r-status-font);line-height:1.05;margin:0">status</p></div>
  <div class="r-replay region control" data-region="replay"><!-- Replay outlined command with rotate icon.: rebuild the control's chrome from the crop (comp-spec.mjs --crop replay); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-answer-0 region control" data-region="answer-0"><!-- Equal outlined answer key 1, unselected.: rebuild the control's chrome from the crop (comp-spec.mjs --crop answer-0); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-answer-1 region control" data-region="answer-1"><!-- Equal outlined answer key b9, unselected.: rebuild the control's chrome from the crop (comp-spec.mjs --crop answer-1); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-answer-2 region control" data-region="answer-2"><!-- Equal outlined answer key 9, unselected.: rebuild the control's chrome from the crop (comp-spec.mjs --crop answer-2); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-answer-3 region control" data-region="answer-3"><!-- Equal outlined answer key b3, unselected.: rebuild the control's chrome from the crop (comp-spec.mjs --crop answer-3); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-answer-4 region control" data-region="answer-4"><!-- Equal outlined answer key 3, unselected.: rebuild the control's chrome from the crop (comp-spec.mjs --crop answer-4); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-answer-5 region control" data-region="answer-5"><!-- Equal outlined answer key 11, unselected.: rebuild the control's chrome from the crop (comp-spec.mjs --crop answer-5); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-answer-6 region control" data-region="answer-6"><!-- Equal outlined answer key #11, unselected.: rebuild the control's chrome from the crop (comp-spec.mjs --crop answer-6); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-answer-7 region control" data-region="answer-7"><!-- Equal outlined answer key 5, unselected.: rebuild the control's chrome from the crop (comp-spec.mjs --crop answer-7); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-answer-8 region control" data-region="answer-8"><!-- Equal outlined answer key b13, unselected.: rebuild the control's chrome from the crop (comp-spec.mjs --crop answer-8); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-answer-9 region control" data-region="answer-9"><!-- Equal outlined answer key 13, unselected.: rebuild the control's chrome from the crop (comp-spec.mjs --crop answer-9); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-answer-10 region control" data-region="answer-10"><!-- Equal outlined answer key b7, unselected.: rebuild the control's chrome from the crop (comp-spec.mjs --crop answer-10); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-answer-11 region control" data-region="answer-11"><!-- Equal outlined answer key maj7, unselected.: rebuild the control's chrome from the crop (comp-spec.mjs --crop answer-11); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-details region control" data-region="details"><!-- Session settings disclosure below response area.: rebuild the control's chrome from the crop (comp-spec.mjs --crop details); its ink box, border, fill, radius, and label size are the comp's --></div>
</main>
</body>
</html>
